<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background 3D Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 3D Cap Top Facet Gradient -->
    <linearGradient id="cap-top" x1="16" y1="12" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Gold 3D Accent Gradient -->
    <linearGradient id="gold-grad" x1="20" y1="26" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Digital Core Glow -->
    <linearGradient id="core-glow" x1="32" y1="20" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- 3D Drop Shadow Filter -->
    <filter id="shadow-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow-3d" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 6px #60A5FA); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); transform-origin: 32px 32px; }
      100% { transform: rotate(360deg); transform-origin: 32px 32px; }
    }
    @keyframes floatSpark {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .animated-core {
      animation: pulseCore 3s ease-in-out infinite;
      transform-origin: 32px 22px;
    }
    .animated-float {
      animation: floatSpark 4s ease-in-out infinite;
    }
    .animated-ring {
      animation: rotateRing 12s linear infinite;
    }
  </style>

  <!-- 3D Base Squircle Tile -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bg-grad)" filter="url(#shadow-3d)" />
  
  <!-- Outer Bevel Edge / Gloss Inner Ring -->
  <rect x="3" y="3" width="58" height="58" rx="17" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" />
  <rect x="4" y="4" width="56" height="28" rx="16" fill="rgba(255,255,255,0.12)" />

  <!-- Animated Ambient Ring Effect in Background -->
  <g class="animated-ring" opacity="0.35">
    <circle cx="32" cy="32" r="23" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="8 6" stroke-linecap="round" />
    <circle cx="32" cy="32" r="23" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 14" stroke-linecap="round" />
  </g>

  <!-- 3D Cap Group with Floating Animation -->
  <g class="animated-float">
    <!-- 3D Cap Diamond Portal Top -->
    <path d="M32 10L54 22L32 34L10 22L32 10Z" fill="url(#cap-top)" filter="url(#shadow-3d)" />
    <path d="M32 10L54 22L32 34L10 22L32 10Z" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 3D Front Lower Facet of Cap -->
    <path d="M10 22L32 34V37L10 25V22Z" fill="#6366F1" />
    <path d="M54 22L32 34V37L54 25V22Z" fill="#4338CA" />

    <!-- 3D Golden Arch Ribbons & Base -->
    <path d="M18 28V43C18 43 23 52 32 52C41 52 46 43 46 43V28" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow-3d)" />
    
    <!-- Inner Academic Plaque Highlight -->
    <path d="M23 37C25 40 28 42 32 42C36 42 39 40 41 37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Golden Tassel & Hanging Jewel -->
    <path d="M48 24V44" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="48" cy="46" r="3.5" fill="#F59E0B" filter="url(#glow-3d)" />
    <circle cx="48" cy="46" r="1.5" fill="#FFFBEB" />

    <!-- Animated 3D Digital Spark Core in Center of Portal -->
    <g class="animated-core">
      <circle cx="32" cy="22" r="5" fill="url(#core-glow)" filter="url(#glow-3d)" />
      <circle cx="32" cy="22" r="2.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
